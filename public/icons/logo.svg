<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="efferdGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16202c" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Dark Obsidian Brutalist Background -->
  <rect width="512" height="512" fill="#090e14" />
  
  <!-- Subtle Efferd Matrix Grid -->
  <rect width="512" height="512" fill="url(#efferdGrid)" opacity="0.6" />

  <!-- Outer Sharp Brutalist Border (Zero Radius) -->
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" />

  <!-- 4 Corner Decor Accents (Brutalist Crosshairs) -->
  <path d="M 24 36 L 48 36 M 36 24 L 36 48" stroke="#00e599" stroke-width="6" />
  <path d="M 464 36 L 488 36 M 476 24 L 476 48" stroke="#00e599" stroke-width="6" />
  <path d="M 24 476 L 48 476 M 36 464 L 36 488" stroke="#00e599" stroke-width="6" />
  <path d="M 464 476 L 488 476 M 476 464 L 476 488" stroke="#00e599" stroke-width="6" />

  <!-- Inner Survey Form Card (Sharp Box) -->
  <rect x="80" y="80" width="352" height="352" fill="#0d141d" stroke="#1e293b" stroke-width="4" />

  <!-- Survey Header Bar -->
  <rect x="110" y="116" width="160" height="18" fill="url(#neonGlow)" />
  <rect x="286" y="116" width="116" height="18" fill="#334155" />

  <!-- Row 1: Likert / Evaluation Matrix Line -->
  <rect x="110" y="164" width="220" height="14" fill="#ffffff" opacity="0.9" />
  <rect x="350" y="156" width="30" height="30" fill="url(#emeraldGrad)" />

  <!-- Row 2: Evaluation Matrix Line -->
  <rect x="110" y="214" width="180" height="14" fill="#ffffff" opacity="0.9" />
  <rect x="350" y="206" width="30" height="30" fill="url(#emeraldGrad)" />

  <!-- Row 3: Evaluation Matrix Line -->
  <rect x="110" y="264" width="240" height="14" fill="#ffffff" opacity="0.9" />
  <rect x="350" y="256" width="30" height="30" fill="url(#emeraldGrad)" />

  <!-- Large Stylized Angular Brutalist Checkmark Emblem at Bottom-Right / Foreground -->
  <g transform="translate(16, 20)">
    <!-- Checkmark Backplate / Shadow Block -->
    <polygon points="120,340 180,400 380,200 350,170 180,340 150,310" fill="#090e14" />
    <!-- Glowing Neon Checkmark -->
    <polygon points="110,330 180,400 390,190 355,155 180,330 145,295" fill="url(#neonGlow)" />
  </g>

  <!-- Tech Indicator Monospace Badge -->
  <rect x="110" y="380" width="56" height="16" fill="#10b981" opacity="0.2" />
  <rect x="110" y="380" width="16" height="16" fill="#00e599" />
  <rect x="134" y="384" width="26" height="8" fill="#94a3b8" />
</svg>

